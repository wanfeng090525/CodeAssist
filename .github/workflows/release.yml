name: Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

# Build the release variants of the installable Android app (:ide-android) on GitHub's hosted runners.
# The `release` build type is left unsigned when no keystore is configured (Play re-signs with the managed
# app key), so a companion `profile` build (release-quality but signed with the debug key) is produced too,
# giving a directly-installable artifact for local testing. Uploading a signed release requires the
# RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD secrets.
env:
  JAVA_VERSION: "25"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease + assembleProfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Build release APK
        run: ./gradlew :ide-android:assembleRelease :ide-android:assembleProfile --console=plain --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-release-apk
          path: ide-android/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload profile APK (installable)
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-profile-apk
          path: ide-android/build/outputs/apk/profile/*.apk
          if-no-files-found: error
          retention-days: 30